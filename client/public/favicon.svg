<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Warm Foodie Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E00" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FF2E00" />
    </linearGradient>

    <!-- Metallic Cloche Fill -->
    <linearGradient id="clocheGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EA" />
      <stop offset="35%" stop-color="#FFC87C" />
      <stop offset="100%" stop-color="#FF9600" />
    </linearGradient>

    <!-- Glossy Highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- App Rounded Container -->
  <rect x="25" y="25" width="450" height="450" rx="105" ry="105" fill="url(#bgGrad)" />

  <g transform="translate(0, 15)">
    <!-- Speed Lines -->
    <g stroke="#1A1A1A" stroke-width="14" stroke-linecap="round">
      <line x1="85" y1="285" x2="135" y2="285" />
      <line x1="60" y1="320" x2="110" y2="320" />
      <line x1="95" y1="355" x2="125" y2="355" />
    </g>

    <!-- Bicycle Wheels -->
    <circle cx="215" cy="335" r="48" fill="none" stroke="#1A1A1A" stroke-width="16" />
    <circle cx="215" cy="335" r="14" fill="#1A1A1A" />
    <circle cx="345" cy="335" r="48" fill="none" stroke="#1A1A1A" stroke-width="16" />
    <circle cx="345" cy="335" r="14" fill="#1A1A1A" />

    <!-- Frame Arc -->
    <path d="M 215 335 C 215 240, 345 240, 345 335" fill="none" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round" />

    <!-- Cloche Base & Gloss -->
    <path d="M 170 240 A 110 110 0 0 1 390 240 Z" fill="url(#clocheGrad)" />
    <path d="M 210 230 A 90 90 0 0 1 340 160 A 90 90 0 0 0 200 230 Z" fill="url(#highlightGrad)" />

    <!-- Cloche Outlines -->
    <circle cx="280" cy="120" r="16" fill="#1A1A1A" />
    <path d="M 170 240 A 110 110 0 0 1 390 240" fill="none" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round" />
    <line x1="150" y1="240" x2="410" y2="240" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round" />

    <!-- Hot Steam Details -->
    <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
      <path d="M 360 170 C 355 155, 365 145, 360 130" />
      <path d="M 385 185 C 380 170, 390 160, 385 145" />
    </g>
  </g>
</svg>